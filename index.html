
<!DOCTYPE html>
<html lang="en-gb">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase10 Генератор</title>

    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css"/>
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

    <script src="phase10.js"></script>
    <link rel="stylesheet" href="phase10.css">
  </head>
  <body>
      <h1>Phase10 Генератор</h1>
    <div class="header max-width">

      <label for="mode-fieldset">Режим</label>
      <fieldset id="mode-fieldset" data-role="controlgroup" data-type="horizontal">
        <label for="mode-classic">Классический</label>
        <input type="radio" id="mode-classic" value="classic" name="mode" checked="checked"/>

        <label for="mode-advanced">Расширенный</label>
        <input type="radio" id="mode-advanced" value="advanced" name="mode"/>
      </fieldset>

      <div hidden="hidden" id="advanced-options">
        <fieldset class="ui-grid-a">
          <div class="ui-block-a">
            <label for="difficulty">Сложность</label>
            <select id="difficulty" name="difficulty">
              <option value="1">Очень Легко</option>
              <option value="2">Легко</option>
              <option value="3" selected="selected">Средне</option>
              <option value="4">Тяжело</option>
              <option value="5">Очень Тяжело</option>
              <option value="all-ranks">Случайно</option>
            </select>
          </div>
          <div class="ui-block-b">
            <label for="phaseCount">Количество фаз</label>
            <select id="phaseCount" name="phaseCount">
              <option value='1'>1</option>
              <option value='2'>2</option>
              <option value='3'>3</option>
              <option value='4'>4</option>
              <option value='5'>5</option>
              <option value='6'>6</option>
              <option value='7'>7</option>
              <option value='8'>8</option>
              <option value='9'>9</option>
              <option value='10' selected="selected">10</option>
            </select>
          </div>
        </fieldset>
      </div>

      <button class="ui-btn ui-corner-all ui-btn-inline" id="generate-phases">Сгенерировать Фазы
      </button>
    </div>
    <div class="results max-width" id="generator-result"></div>
    <div class="game-wrap max-width" id="game-wrap" hidden="hidden">
      <button class="ui-btn ui-corner-all ui-btn-inline" id="start-game">Начать игру
      </button>
      <button class="ui-btn ui-corner-all ui-btn-inline" id="new-game" style="display:none;">Новая игра
      </button>
      <div class="game max-width" id="game" hidden="hidden">
        <h2>Игра</h2>
        <label for="player-count">Количество игроков:</label>
        <input type="number" id="player-count" min="1" max="6" value="2">
        <button class="ui-btn ui-corner-all ui-btn-inline" id="create-game">Создать таблицы</button>

        <div class="game-area max-width" id="game-area" hidden="hidden">
            <h3>Таблица фаз</h3>
            <div id="phase-table-container"></div>
            <h3>Очки игроков</h3>
            <table id="score-table" border="1">
                <thead>
                    <tr>
                        <th>Игрок</th>
                        <th>Очки</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    </div>
  </body>
</html>
